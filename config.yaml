name: "Claude Code Agent"
version: "1.6.3"
slug: "claude-code-agent"
description: "Headless Claude Code with Remote Control and an Assist conversation agent, connected to Home Assistant via MCP."
url: "https://github.com/MartinNuc/hass-claude-code"

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false

ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:console

# Add-on gets SUPERVISOR_TOKEN automatically — used as HA MCP token by default
homeassistant_api: true

map:
  - homeassistant_config:rw
  - addon_config:rw

options:
  session_name: "Home Assistant"
  ha_agent_url: ""
  ha_agent_key: ""
  ha_mcp_token: ""
  debug_daemon_output: false

schema:
  session_name: str?
  ha_agent_url: str?
  ha_agent_key: str?
  ha_mcp_token: str?
  debug_daemon_output: bool?
