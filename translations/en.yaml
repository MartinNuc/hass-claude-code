configuration:
  session_name:
    name: Claude Code Remote Control session name
    description: >-
      The name this Home Assistant shows in the Remote Control list at
      claude.ai/code and in the Claude mobile app. Useful if you run Claude
      Code on more than one machine. Leave blank to use "Home Assistant".
  ha_agent_url:
    name: HA Vibecode Agent URL
    description: >-
      Where to reach the separate HA Vibecode Agent add-on, which gives the
      Remote Control session its Home Assistant tools. Leave blank for the
      default (http://homeassistant:8099), which works on HAOS.
  ha_agent_key:
    name: HA Vibecode Agent API key
    description: >-
      API key copied from the HA Vibecode Agent add-on's Web UI. Optional —
      leave blank if you do not run that add-on. The Remote Control session
      then starts with no Home Assistant tools; the Assist agent is unaffected.
  ha_mcp_token:
    name: Home Assistant MCP token
    description: >-
      Long-lived access token for Home Assistant's own MCP server, used by the
      Assist conversation agent. Leave blank unless the add-on log reports that
      the Supervisor token was rejected. Setting it switches the Assist agent
      from the Supervisor API proxy to talking to Home Assistant directly, at
      the address below.
  ha_url:
    name: Home Assistant URL (advanced)
    description: >-
      Where to reach Home Assistant directly. Used only when an MCP token is
      set above; otherwise the add-on goes through the Supervisor proxy and
      this is ignored. Leave blank for http://homeassistant:8123 — set it if
      you serve Home Assistant on a different port, e.g. http://homeassistant:80.
  debug_daemon_output:
    name: Log Claude daemon output (debugging)
    description: >-
      Write the Remote Control session's terminal output to the add-on log.
      Off by default, because it is noisy. Turn it on if the session never
      appears at claude.ai/code — without it the log cannot show what the
      session is waiting on.
